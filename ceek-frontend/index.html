<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ceek App</title>

  <!-- Add PrismJS styles -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.27.0/themes/prism-tomorrow.min.css">
</head>
<body class="h-full flex flex-col items-center justify-start p-4">

  <!-- Navigation and search bar -->
  <div class="mb-4">
    <input type="text" id="search-input" placeholder="Search courses..." class="mr-2 px-2 py-1 border rounded">
    <button id="search-button">Search</button>
  </div>

  <!-- Course list -->
  <ul id="course-list" class="mb-4"></ul>

  <!-- Classes -->
  <div id="classes"></div>

  <!-- Pagination -->
  <div id="pagination"></div>

  <!-- Include Alpine.js CDN (for development) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.10.6/dist/cdn.min.js"></script>
  <script src="/src/main.ts" type="module"></script>

</body>
</html>
